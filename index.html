<!doctype html>
<html lang="en" style="height: 100%;">

<head>
  <meta charset="utf-8">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, shrink-to-fit=no, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="./manifest.json">

  <title>web-component-designer-simple-demo</title>

  <script type="esms-options">
    {
      "shimMode": true
    }
  </script>
  <script src="./node_modules/es-module-shims/dist/es-module-shims.js"></script>
  <script>
    const importMap = {
      imports: {
        "monaco-editor/": "./node_modules/monaco-editor/",
        "@node-projects/web-component-designer-codeview-monaco": "./node_modules/@node-projects/web-component-designer-codeview-monaco/dist/widgets/codeView/code-view-monaco.js",
        "@node-projects/web-component-designer-codeview-monaco/": "./node_modules/@node-projects/web-component-designer-codeview-monaco/",
        "@node-projects/web-component-designer": "./node_modules/@node-projects/web-component-designer/dist/index-min.js",
        "@node-projects/web-component-designer/": "./node_modules/@node-projects/web-component-designer/",
        "@node-projects/base-custom-webcomponent/": "./node_modules/@node-projects/base-custom-webcomponent/",
        "@node-projects/base-custom-webcomponent": "./node_modules/@node-projects/base-custom-webcomponent/dist/index.js",
        "@node-projects/web-component-designer-zpl": "./node_modules/@node-projects/web-component-designer-zpl/dist/index.js",
        "@node-projects/web-component-designer-zpl/": "./node_modules/@node-projects/web-component-designer-zpl/",
        "@node-projects/web-component-designer-widgets-wunderbaum": "./node_modules/@node-projects/web-component-designer-widgets-wunderbaum/dist/index.js",
        "@bwip-js/browser": "./node_modules/@bwip-js/browser/dist/bwip-js.mjs",
        "wunderbaum": "./node_modules/wunderbaum/dist/wunderbaum.esm.min.js",
        "wunderbaum/": "./node_modules/wunderbaum/"
      }
    };
    //@ts-ignore
    importShim.addImportMap(importMap);
  </script>

  <script src="./node_modules/monaco-editor/min/vs/loader.js"></script>
  <script>
    require.config({ paths: { 'vs': 'node_modules/monaco-editor/min/vs', 'vs/css': { disabled: true } } });
    require(['vs/editor/editor.main'], () => { });    
  </script>

  <style>
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      font-family: 'Roboto', 'Noto', sans-serif;
      line-height: 1.5;
      background-color: white;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      display: grid;
      grid-template-areas:
        "a c"
        "t c"
        "b c";
      grid-template-columns: 240px minmax(0, 1fr);
      grid-template-rows: minmax(0, 5fr) minmax(0, 3fr) minmax(0, 5fr);
      height: 100%;
      width: 100%;
      gap: 3px;
    }

    node-projects-palette-view,
    node-projects-web-component-designer-property-grid-with-header {
      min-height: 0;
      overflow: hidden;
    }

    #tree-panel {
      grid-area: t;
      display: flex;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      background: var(--medium-grey, #2f3545);
    }

    #tree-panel-title {
      box-sizing: border-box;
      height: 30px;
      flex: 0 0 30px;
      padding: 6px 8px;
      color: white;
      background: var(--dark-grey, #232733);
      font: 500 12px Arial;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    node-projects-tree-view-extended {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #licenses {
      position: fixed;
      right: 8px;
      bottom: 5px;
      z-index: 1000;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, .9);
      font-size: 11px;
    }
  </style>
</head>

<body style="height: 100%; width: 100%;">
  <div id="root">
    <node-projects-palette-view style="grid-area: a;"></node-projects-palette-view>
    <section id="tree-panel">
      <div id="tree-panel-title">Elements</div>
      <node-projects-tree-view-extended></node-projects-tree-view-extended>
    </section>
    <node-projects-web-component-designer-property-grid-with-header style="grid-area: b;"></node-projects-web-component-designer-property-grid-with-header>

  </div>
  <a id="licenses" href="./THIRD-PARTY-LICENSES.md" target="_blank" rel="license noopener">Acknowledgements &amp; third-party licenses</a>

</body>

<script type="module">
  importShim('./dist/initialize.js');
</script>

</html>
